# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  activemodel:
    attributes:
      forecast_search:
        address: "Address"
    errors:
      models:
        forecast_search:
          attributes:
            address:
              blank: "is required. Please enter a US street address."
  date:
    formats:
      forecast_day: "%a, %b %-d"
  forecasts:
    title: "Weather Forecast"
    subtitle: "Enter a US street address to see the current temperature and the 7-day forecast."
    attribution_html: "Addresses by the %{census}. Weather data by %{open_meteo}."
    census: "US Census Geocoder"
    open_meteo: "Open-Meteo"
    form:
      address_label: "Address"
      address_placeholder: "1600 Pennsylvania Ave NW, Washington, DC"
      submit: "Get forecast"
      submitting: "Loading…"
    show:
      zip_code_html: "Zip code %{zip_code}"
      cached: "Cached"
      cached_since: "Fetched %{time} ago. Forecasts are cached for 30 minutes per zip code."
      live: "Live"
      live_since: "Fetched just now."
      current: "now"
      temperature: "%{degrees}°F"
      day: "Day"
      high: "High"
      low: "Low"
      other_addresses: "Other addresses matching your search"
      show_forecast: "Show forecast"
  forecast_service:
    errors:
      address_not_found: "Could not find the address \"%{address}\". Please enter a full US street address with number, street, city and state."
      generic: "Could not retrieve the forecast right now. Please try again later."
